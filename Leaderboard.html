  <style>
body {
  margin: 0;
  background: #050505;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}
.sidenav {
  box-sizing: border-box;
  width: 275px;
  height: 100vh;
  position: fixed;
  z-index: 2;
  top: 0;
  left: 0;
  padding: 12px 14px;
  background: #050505;
  border-right: 2px solid #191919;
}
.sidenav a {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  margin: 7px 0;
  padding: 8px 9px;
  background: #191919;
  color: #f7f7f7;
  text-decoration: none;
  text-transform: uppercase;
  font: 600 16px "Arial Narrow", Arial, sans-serif;
}
.sidenav a svg {
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.sidenav a svg .filled { fill: currentColor; stroke: none; }
.sidenav a:hover { color: #10a95a; }
.main { margin-left: 275px; padding: 24px 32px 48px; color: #f5f5f5; }
.main h1 {
  margin: 0 0 20px;
  font: 600 clamp(28px, 3vw, 40px) "Arial Narrow", Arial, sans-serif;
}
@media (max-width: 700px) {
  .sidenav { width: 190px; padding: 10px; }
  .sidenav a { font-size: 14px; }
  .main { margin-left: 190px; padding: 24px 16px 48px; }
}
.standings {
  width: 100%;
  overflow-x: auto;
  background: #212327;
}
.standings h2 {
  margin: 0;
  padding: 16px 14px;
  border-bottom: 1px solid #484a50;
  font: 600 21px "Arial Narrow", Arial, sans-serif;
}
.standings table {
  width: 100%;
  border-collapse: collapse;
  text-align: center;
}
.standings th,
.standings td {
  padding: 13px 12px;
  border-bottom: 1px solid #484a50;
}
.standings th {
  color: #b7b9c1;
  font-size: 13px;
  font-weight: 400;
}
.standings td {
  font-size: 15px;
  font-weight: 600;
}
.standings th:first-child,
.standings td:first-child {
  width: 55%;
  text-align: left;
}
.standings tbody tr:last-child td { border-bottom: 0; }
.standings tbody tr:hover { background: #2a2c31; }
</style>
</head>
